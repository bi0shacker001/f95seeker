name: Build and release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore release signing key
        shell: bash
        run: echo "$F95SEEKER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/f95seeker-release.p12"
        env:
          F95SEEKER_KEYSTORE_BASE64: ${{ secrets.F95SEEKER_KEYSTORE_BASE64 }}

      - name: Build APK
        run: flutter build apk --release
        env:
          F95SEEKER_KEYSTORE: ${{ runner.temp }}/f95seeker-release.p12
          F95SEEKER_STORE_PASSWORD: ${{ secrets.F95SEEKER_STORE_PASSWORD }}
          F95SEEKER_KEY_ALIAS: f95seeker
          F95SEEKER_KEY_PASSWORD: ${{ secrets.F95SEEKER_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: f95seeker-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
